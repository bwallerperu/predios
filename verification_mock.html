<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - Rosario Pinillos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3384FF;
            --primary-dark: #1E66D6;
            --surface: #FFFFFF;
            --background: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
        }

        .card-property {
            background: var(--surface);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="p-8">
    <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Mocked Card -->
        <div class="card-property group">
            <div class="relative h-64 overflow-hidden">
                <div class="w-full h-full bg-slate-100 flex items-center justify-center text-slate-300">
                    <i class="fas fa-camera text-4xl"></i>
                </div>
                <div class="absolute top-4 left-4 flex gap-2">
                    <span class="px-3 py-1 rounded-full bg-white/90 backdrop-blur-md text-[10px] font-bold text-blue-600 shadow-sm uppercase tracking-wider">Casa</span>
                </div>
            </div>

            <div class="p-5">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">Venta</p>
                        <p class="text-2xl font-bold text-slate-900 leading-none">$450,000</p>
                    </div>
                    <div class="text-right">
                        <span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 text-[9px] font-bold uppercase">Final</span>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1 leading-tight line-clamp-1">Hermosa Residencia en Miraflores</h3>
                <div class="flex items-center text-slate-400 text-xs mb-4">
                    <i class="fas fa-map-marker-alt mr-1.5 text-blue-500/50"></i>
                    <span class="truncate">Av. Larco 123, Miraflores</span>
                </div>
                <div class="grid grid-cols-3 gap-2 py-3 border-y border-slate-50">
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Área</p>
                        <p class="text-sm font-bold text-slate-700">200 <span class="text-[10px] font-normal">m²</span></p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">$/m²</p>
                        <p class="text-sm font-bold text-slate-700">$2,250</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Comisión</p>
                        <p class="text-sm font-bold text-emerald-500">3%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
