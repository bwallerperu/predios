<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinement Verification - Rosario Pinillos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3384FF;
            --primary-dark: #1E66D6;
            --surface: #FFFFFF;
            --background: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
        }

        .card-property {
            background: var(--surface);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            max-width: 400px;
        }
    </style>
</head>
<body class="p-8">
    <div id="property-list" class="grid grid-cols-1 gap-6">
        <!-- Mocked Refined Card -->
        <div class="card-property group">
            <div class="relative h-64 overflow-hidden">
                <div class="w-full h-full bg-slate-100 flex items-center justify-center text-slate-300">
                    <i class="fas fa-camera text-4xl"></i>
                </div>
                <div class="absolute top-4 left-4 flex gap-2">
                    <span class="px-3 py-1 rounded-full bg-white/90 backdrop-blur-md text-[10px] font-bold text-blue-600 shadow-sm uppercase tracking-wider">Departamento</span>
                </div>
            </div>

            <div class="p-5">
                <h3 class="text-lg font-bold text-slate-800 mb-1 leading-tight line-clamp-1">Lujoso Penthouse en Barranco</h3>
                <div class="flex items-center text-slate-400 text-xs mb-3">
                    <a href="https://www.google.com/maps/search/?api=1&query=Malec%C3%B3n+Castilla+456%2C+Barranco" target="_blank" class="hover:text-blue-500 transition-colors">
                        <i class="fas fa-map-marker-alt mr-1.5 text-blue-500/50"></i>
                    </a>
                    <span class="truncate">Malecón Castilla 456, Barranco</span>
                </div>

                <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-50">
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-none mb-1.5">Venta</p>
                        <p class="text-2xl font-bold text-slate-900 leading-none">$850,000</p>
                    </div>
                    <div class="text-right">
                        <span class="px-2 py-1 rounded-md bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-wider">Precio Final</span>
                    </div>
                </div>

                <!-- Metrics Grid -->
                <div class="grid grid-cols-3 gap-2 py-1">
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Área</p>
                        <p class="text-base font-bold text-slate-700">180 <span class="text-[10px] font-normal">m²</span></p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">$/m²</p>
                        <p class="text-base font-bold text-slate-700">$4,722</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Comisión</p>
                        <p class="text-base font-bold text-emerald-500">5%</p>
                        <p class="text-[10px] font-bold text-emerald-600/70">$42,500</p>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="mt-4 flex gap-2">
                    <a href="#" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center hover:bg-blue-50 hover:text-blue-600 transition-colors" title="TH Link"><i class="fas fa-building"></i></a>
                    <a href="#" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center hover:bg-emerald-50 hover:text-emerald-600 transition-colors" title="HOL Link"><i class="fas fa-external-link-alt"></i></a>
                    <div class="flex-1"></div>
                    <button class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center hover:bg-blue-50 hover:text-blue-500 transition-colors" title="Editar"><i class="fas fa-edit"></i></button>
                    <button class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center hover:bg-rose-50 hover:text-rose-500 transition-colors" title="Eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
