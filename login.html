<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Rosario Pinillos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3384FF;
            --background: #F8FAFC;
        }

        body {
            background-color: var(--background);
            font-family: 'Outfit', sans-serif;
            background-image:
                radial-gradient(at 0% 0%, hsla(213, 100%, 73%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(213, 100%, 73%, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .input-group input:focus+label,
        .input-group input:not(:placeholder-shown)+label {
            transform: translateY(-1.5rem) scale(0.85);
            color: var(--primary);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-[32px] p-8 sm:p-10 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-100 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-100 rounded-full blur-3xl opacity-50"></div>

        <div class="relative z-10">
            <!-- Header -->
            <div class="text-center mb-10">
                <div
                    class="inline-flex w-20 h-20 bg-white rounded-2xl shadow-sm border border-slate-100 items-center justify-center mb-6">
                    <img src="/static/logo.jpg" alt="Logo"
                        onerror="this.outerHTML='<i class=\'fas fa-building text-3xl text-blue-500\'></i>'"
                        class="w-16 h-16 object-contain rounded-xl">
                </div>
                <h1 class="text-2xl font-bold text-slate-800 leading-tight">Rosario Pinillos</h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold mt-1">Gestión Inmobiliaria</p>
            </div>

            {% if error %}
            <!-- Error Message -->
            <div
                class="bg-red-50 text-red-600 text-sm font-medium px-4 py-3 rounded-xl mb-6 flex items-center gap-3 border border-red-100 animate-[pulse_1s_ease-in-out]">
                <i class="fas fa-exclamation-circle text-lg"></i>
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <!-- Form -->
            <form action="/login" method="POST" class="space-y-6">
                <div class="relative input-group">
                    <input type="text" id="username" name="username" required placeholder=" "
                        class="block w-full px-4 pt-6 pb-2 text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer">
                    <label for="username"
                        class="absolute text-slate-400 text-sm font-medium duration-200 transform top-4 left-4 origin-[0] peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 pointer-events-none">
                        Usuario
                    </label>
                </div>

                <div class="relative input-group">
                    <input type="password" id="password" name="password" required placeholder=" "
                        class="block w-full px-4 pt-6 pb-2 text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer">
                    <label for="password"
                        class="absolute text-slate-400 text-sm font-medium duration-200 transform top-4 left-4 origin-[0] peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 pointer-events-none">
                        Contraseña
                    </label>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 hover:bg-blue-700 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 mt-8">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-[10px] text-slate-400">&copy;
                    <script>document.write(new Date().getFullYear())</script> Sistema de Gestión Interna
                </p>
            </div>
        </div>
    </div>
</body>


</html>
